name: course-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Validate course structure
        run: >-
          uv run --no-project
          --with nbformat
          --with numpy
          --with soundfile
          python scripts/validate_course.py --source-only

      - name: Compile Python sources
        run: python -m compileall -q deployment scripts
